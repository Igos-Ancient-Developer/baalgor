<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0609">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2715%27 fill=%27%23c8202e%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27%3E%E2%98%A0%3C/text%3E%3C/svg%3E">
<title>Baalgor</title>
<meta property="og:title" content="Baalgor">
<meta property="og:description" content="Мрачная tower defense: строй башни и отбивай нечисть">
<meta property="og:image" content="cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" as="image" href="img/ui/logo_s.webp">
<link rel="preload" as="font" type="font/woff2" href="fonts/oswald-cyrillic-3.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/playfair-sc-cyrillic.woff2" crossorigin>
<style>
/* Критический стиль: тёмный фон, логотип и полоса загрузки видны сразу, до загрузки основного css и скриптов (без белых прямоугольников) */
html,body{margin:0;height:100%;background:#0b0609;overflow:hidden;color-scheme:dark}
#app{position:fixed;inset:0;height:100dvh;background:radial-gradient(ellipse at 50% 0%,#2a1018 0%,#0b0609 60%)}
.hidden{display:none!important}
#loading{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#3a1420 0%,#120709 55%,#0b0609 100%)}
#loading .logo-img{display:block;width:min(70vw,300px);height:auto;aspect-ratio:1;object-fit:contain;opacity:0;transition:opacity .25s}
#loading .logo-img.ok{opacity:1}
img:not([src]),img[src=""]{visibility:hidden}
.loadbar{width:min(80%,300px);height:10px;margin-top:30px;border:2px solid #6e3a3a;border-radius:8px;background:#1a0a0e;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a1220,#ff4a5a)}
@font-face{font-family:'Playfair Display SC';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/playfair-sc-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Playfair Display SC';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/playfair-sc-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Playfair Display SC';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/playfair-sc-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'DiabloFont';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/diablo.ttf) format('truetype')}
@font-face{font-family:'Oswald';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/oswald-cyrillic-3.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Oswald';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/oswald-latin-ext-4.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Oswald';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/oswald-latin-5.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Oswald';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/oswald-cyrillic-3.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Oswald';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/oswald-latin-ext-4.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Oswald';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/oswald-latin-5.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
</style>
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css?v=20261030220604" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="css/style.css?v=20261030220604"></noscript>
</head>
<body>
<div id="app">
  <div id="note"></div>

  <!-- БОЙ -->
  <div id="game" class="hidden">
    <div id="hud">
      <div class="chip" id="chip-lives"><img data-icon="heart"><b id="v-lives">5</b></div>
      <div class="chip gold" id="chip-gold">
        <img data-icon="coin"><b id="v-gold">0</b><span id="v-inc">+5</span>
      </div>
      <div class="chip" id="chip-wave"><img data-icon="skull"><b id="v-wave">0/30</b></div>
      <div class="spacer"></div>
      <div class="chip hidden htime" id="chip-time"><img class="hg" alt=""><b id="rh-time">0:00</b></div>
      <button class="ibtn" id="b-pause" aria-label="Пауза"><img data-icon="pause"></button>
    </div>

    <div id="stage">
      <canvas id="cv"></canvas>
      <button id="wcall" class="wcall hidden" aria-label="Вызвать волну"><i class="wring"></i><span class="wface"><img class="wic" alt=""></span><b class="wn"></b><span class="wb"></span></button>
      <div id="achtoast"></div>
      <div id="bossbar" class="hidden"><span id="bossname"></span><i><u id="bossfill"></u></i></div>
      <div id="tutlayer" class="hidden"><i></i><i></i><i></i><i></i><div id="tutring"></div><b id="tutcatch"></b></div><img id="tuthand" class="hidden" alt="">
      <div id="dock">
        <div id="dinfo" class="hidden"></div>
        <div id="slots"></div>
        <button id="slotbtn" aria-label="Постройки"><img class="sb-ic" alt=""><i class="sb-n"></i></button>
      </div>
      <div id="sel" class="hidden"></div>
    </div>

    <div id="revive" class="hidden"><div class="rv-box">
      <img class="rv-ic" id="rv-ic" alt="">
      <div class="rv-t">Крепость пала!</div>
      <div class="rv-s" id="rv-sub"></div>
      <div class="rv-bal" id="rv-bal"></div>
      <button class="btn big" id="rv-buy"></button>
      <button class="btn" id="rv-shop">Пополнить кристаллы</button>
      <button class="rv-no" id="rv-no">Сдаться</button>
    </div></div>
    <div id="sellmodal" class="hidden"><div class="sm-box"><div class="sm-top"><img id="sm-ic" alt=""><div class="sm-v"><img class="cg" alt=""><b id="sm-v">0</b></div></div><div class="sm-q">Продать здание?</div><div class="sm-b"><button id="sm-yes" aria-label="Продать">✓</button><button id="sm-no" aria-label="Отмена">✕</button></div></div></div>

    <div id="upmodal" class="hidden">
      <div class="um-box">        <div class="um-head"><div class="um-t"><b id="um-name"></b><small id="um-sub"></small></div><span class="um-gold"><img class="cg" alt=""><b id="um-gold">0</b></span></div>
        <div class="um-cards" id="um-cards"></div>
        <button class="btn um-cancel" id="um-cancel">Отмена</button></div>
    </div>
  </div>

  <div id="busy" class="hidden"><i></i></div>

  <!-- ЗАГРУЗКА -->
  <div id="loading" class="screen">
    <img class="logo-img" id="load-logo" src="img/ui/logo_s.webp" alt="" onload="this.classList.add('ok')">
    <div class="loadbar"><i id="loadfill"></i></div>
  </div>

  <!-- СТАРТ -->
  <div id="title" class="screen hidden">
    <div class="embers"></div>
    <div id="toprow"><button class="gembtn" id="b-gems" aria-label="Магазин кристаллов"><span id="gem-ic"></span><b id="gem-n">0</b></button><div class="pf" id="pf"></div></div>
    <img class="logo-img big" id="title-logo" alt="">
    <div class="title-actions">
      <button class="stn primary" id="b-start"><span>Начать игру</span></button>
      <button class="stn ranked" id="b-ranked"><img class="tk" alt=""><span>Рейтинговый забег</span></button>
      <div class="title-aux">
        <button class="stn" id="b-achs"><span>Награды</span></button>
        <button class="stn" id="b-settings"><span>Настройки</span></button>
      </div>
      <span id="legacy-nav" hidden><button id="b-forge"></button><button id="b-board"></button></span>
    </div>
  </div>

  <!-- КАРТА КАМПАНИИ -->
  <div id="world" class="screen sub hidden">
    <button class="btn tb-forge float" id="world-forge">Кузница</button>
    <div class="topbar">
      <button class="back" id="world-back"></button>
      <div class="spacer"></div>
      <div class="rps" id="world-souls"></div>
      <div class="iconrow small" id="world-icons"></div>
    </div>
    <div id="worldscroll"><div id="worldmap"><img id="worldimg" alt=""><canvas id="worldcv"></canvas><div id="sectors"></div><div id="nodes"></div></div></div>
  </div>

  <!-- ВЫБОР СЛОЖНОСТИ -->
  <div id="diffsheet" class="screen sub hidden">
    <div class="topbar"><button class="back" id="ds-back"></button></div>
    <div id="dwrap"><button class="dnav l" id="d-prev" aria-label="Назад"></button><div id="dcar"></div><button class="dnav r" id="d-next" aria-label="Вперёд"></button></div>
    <div id="ddots"></div>
  </div>

  <!-- РЕЙТИНГОВЫЙ ЗАБЕГ -->
  <div id="rankedsheet" class="screen sub hidden">
    <div class="topbar"><button class="back" id="rk-back"></button><h2>Рейтинговый забег</h2></div>
    <div class="subbody" id="rankedbody"></div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div id="settings" class="screen sub hidden">
    <div class="topbar"><button class="back" id="st-back"></button><h2>Настройки</h2></div>
    <div class="subbody" id="settingsbody"></div>
  </div>

  <!-- ТАБЛИЦА ЛИДЕРОВ -->
  <div id="board" class="screen sub hidden">
    <div class="topbar"><button class="back" id="bd-back"></button><h2 id="bd-title"></h2></div>
    <div class="subbody wide"><div id="boardlist"></div></div>
    <div id="bd-me" class="hidden"></div>
  </div>

  <!-- КУЗНИЦА ДУШ -->
  <div id="forge" class="screen sub hidden">
    <div class="topbar"><button class="back" id="forge-back"></button><h2>Кузница</h2><div class="rps" id="forge-souls"></div></div>
    <div class="subbody">
      <div id="dailybox"></div>
      <div class="sect-title">Дары</div><div id="perks"></div>
      <div class="sect-title">Слоты в бою</div><div id="slotsbox"></div>
      <div class="sect-title">Премиум: только за кристаллы</div><div id="premium"></div>
      <div class="sect-title">Арсенал</div><div id="unlocks"></div>
    </div>
  </div>

  <!-- МАГАЗИН -->
  <div id="shop" class="screen sub hidden">
    <div class="topbar"><button class="back" id="shop-back"></button><h2>Магазин</h2><div class="rps" id="shop-res"></div></div>
    <div class="subbody shop" id="shopbody"></div>
  </div>

  <!-- ДОСТИЖЕНИЯ -->
  <div id="achs" class="screen sub hidden">
    <div class="topbar"><button class="back" id="achs-back"></button><h2>Награды</h2><div class="rps" id="achs-count"></div></div>
    <div class="subbody"><div id="achlist"></div></div>
  </div>

  <!-- ПОДГОТОВКА К УРОВНЮ: набор зданий по слотам -->
  <div id="loadout" class="screen sub hidden">
    <div class="topbar"><button class="back" id="lo-back"></button><h2 id="lo-title">Подготовка</h2><div class="lo-cnt" id="lo-cnt"></div><button class="btn tb-forge" id="lo-forge">Кузница</button></div>
    <div class="subbody lo">
      <div class="lo-slots" id="lo-slots"></div>
      <div class="lo-info" id="lo-info"></div>
      <div class="lo-grid" id="lo-grid"></div>
    </div>
    <div class="lo-foot"><button class="btn big" id="lo-go">В бой</button></div>
  </div>

  <!-- ПАУЗА -->
  <div id="pausemenu" class="screen overlay hidden">
    <div class="modal">
      <h2>Пауза</h2>
      <div id="p-score"></div>
      <button class="btn big" id="p-resume">Продолжить</button>
      <button class="btn" id="p-settings">Настройки</button>
      <button class="btn" id="p-restart">Заново</button>
      <button class="btn danger" id="p-quit">На карту</button>
    </div>
  </div>

  <!-- КОНЕЦ ПАРТИИ -->
  <div id="endmenu" class="screen overlay hidden">
    <div class="modal">
      <div id="end-hero"></div>
      <h2 id="end-title"></h2>
      <div id="end-sub"></div>
      <div id="end-verdict"></div>
      <div id="end-score"></div>
      <div id="end-stats"></div>
      <div id="end-souls"></div>
      <div id="end-rank" class="hidden"></div>
      <div id="end-ach"></div>
      <button class="btn big hidden" id="e-next">Дальше</button>
      <button class="btn" id="e-again">Ещё раз</button>
      <button class="btn" id="e-forge">Кузница</button>
      <button class="btn danger" id="e-menu">На карту</button>
    </div>
  </div>

  <!-- нижняя панель вкладок: главное меню, Кузница, Магазин, Рейтинг, Ещё -->
  <nav id="tabbar" class="hidden" aria-label="Разделы">
    <button class="tab on" data-tab="play"><img alt=""><span>Игра</span></button>
    <button class="tab" data-tab="rating"><img alt=""><span>Рейтинг</span></button>
    <button class="tab" data-tab="forge"><img alt=""><span>Кузница</span></button>
    <button class="tab" data-tab="shop"><img alt=""><span>Магазин</span></button>
  </nav>

</div>
<script type="module" src="js/main.js?v=20261030220604"></script>
</body>
</html>
